name: strata
description: A bilingual workspace for managing outlet revenue.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.4
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: 3.9.1
  uuid: ^4.6.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: 2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/art/ledger-study.webp
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
