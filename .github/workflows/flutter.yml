name: Flutter checks
on:
  push:
    branches: [main, arena/868c7ad2-ragaa]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Static analysis
        run: |
          if ! flutter analyze --no-pub > "$RUNNER_TEMP/analyze.txt" 2>&1; then
            cat "$RUNNER_TEMP/analyze.txt"
            grep ' • ' "$RUNNER_TEMP/analyze.txt" | while IFS= read -r issue; do echo "::error::$issue"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/analyze.txt"
      - run: flutter test --no-pub --reporter=github
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter build web --release --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: strata-web
          path: build/web/
          retention-days: 7
