name: Prepare SQLite schema
on:
  push:
    branches: [arena/868c7ad2-ragaa]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: .github/scripts/check flutter pub get
      - run: .github/scripts/check dart run build_runner build --delete-conflicting-outputs
      - run: .github/scripts/check tool/fetch_sqlite_web.sh
      - run: dart format lib/core/database
      - name: Version generated schema, lock and offline runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock lib/core/database web/sqlite linux/flutter macos/Flutter windows/flutter
          git commit -m 'build: lock database dependencies and vendor verified offline SQLite runtime'
          git push origin HEAD:arena/868c7ad2-ragaa
