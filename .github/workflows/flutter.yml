name: Flutter checks
on:
  push:
    branches: [arena/868c7ad2-ragaa]
permissions:
  contents: read
jobs:
  capture:
    name: Capture review images and apply SDK formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format lib test
      - run: flutter test --no-pub --reporter=github --update-goldens test/previews/render_workspace.dart
      - name: Save only review images and formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test docs/previews/
          git commit -m 'style: apply SDK formatting and capture both localized dashboards'
          git push origin HEAD:arena/868c7ad2-ragaa
      - run: flutter test --no-pub --reporter=github
      - run: flutter test --no-pub --reporter=github --platform chrome test/browser_preferences_test.dart
      - run: flutter build web --release --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v7
        with:
          name: strata-web
          path: build/web/
          retention-days: 7
