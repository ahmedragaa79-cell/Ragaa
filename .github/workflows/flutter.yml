name: Flutter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Generate stock platform hosts for initialization
        run: |
          flutter create --no-pub --platforms=android,ios,windows,macos,linux,web --org com.example --project-name strata "$RUNNER_TEMP/strata"
          cd "$RUNNER_TEMP/strata"
          tar czf "$RUNNER_TEMP/hosts.tgz" .metadata android ios linux macos web windows
      - uses: actions/upload-artifact@v4
        with:
          name: platform-hosts
          path: ${{ runner.temp }}/hosts.tgz
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: pubspec.lock
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
