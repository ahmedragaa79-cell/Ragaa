name: Verify outlet implementation
on:
  push:
    branches: [arena/868c7ad2-ragaa]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: .github/scripts/check flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format lib test
      - name: Save official SDK formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test linux/flutter macos/Flutter windows/flutter
          if ! git diff --cached --quiet; then git commit -m 'style: apply SDK formatting to outlet module and tests' && git push origin HEAD:arena/868c7ad2-ragaa; fi
      - run: .github/scripts/check flutter analyze --no-pub
      - if: always() && !cancelled()
        run: .github/scripts/check flutter test --no-pub --reporter=expanded
      - if: always() && !cancelled()
        run: .github/scripts/check flutter build web --release --no-pub --no-web-resources-cdn
